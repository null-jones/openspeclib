name: Deploy Viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      # Bundled into the viewer through the @spec and @allowlist aliases.
      - 'schemas/format-v1/**'
      - 'src/openspeclib/validation_allowlist.json'
      - '.github/workflows/deploy-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install dependencies
        working-directory: viewer
        run: npm ci

      # The release the viewer serves is set in one place: OPENSPECLIB_VERSION
      # in viewer/src/constants/urls.ts.
      - name: Read data release version
        id: release
        run: |
          version=$(sed -nE "s/^export const OPENSPECLIB_VERSION = '([^']+)';/\1/p" viewer/src/constants/urls.ts)
          if [ -z "$version" ]; then echo "::error::OPENSPECLIB_VERSION not found"; exit 1; fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download release data
        working-directory: viewer/public/data
        run: |
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo null-jones/openspeclib \
            --pattern "*.parquet" \
            --pattern "id-migration.csv" \
            --pattern "checksums.txt" \
            --clobber
          sha256sum --check --ignore-missing --strict checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy DuckDB WASM files
        working-directory: viewer
        run: |
          mkdir -p public/duckdb
          cp node_modules/@duckdb/duckdb-wasm/dist/duckdb-mvp.wasm public/duckdb/
          cp node_modules/@duckdb/duckdb-wasm/dist/duckdb-browser-mvp.worker.js public/duckdb/
          cp node_modules/@duckdb/duckdb-wasm/dist/duckdb-eh.wasm public/duckdb/
          cp node_modules/@duckdb/duckdb-wasm/dist/duckdb-browser-eh.worker.js public/duckdb/

      - name: Build
        working-directory: viewer
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
