name: Build and Release Spectral Library

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, e.g. 0.2.0). Must equal the openspeclib package version."
        required: true
        type: string
      sources:
        description: "Comma-separated sources to include (usgs,ecostress,ecosis,relab,asu_tes,bishop,ossl), or 'all' for the released sources (usgs,ecostress,ecosis)"
        required: false
        default: "all"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install openspeclib
        run: pip install -e ".[build,dev]"

      - name: Check release version matches the package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, sys
          import openspeclib
          want = os.environ["RELEASE_VERSION"]
          if openspeclib.__version__ != want:
              sys.exit(f"Release {want} does not match package version {openspeclib.__version__}; bump pyproject.toml first.")
          print(f"Building release {want}")
          PY

      - name: Run tests
        run: pytest tests/ -v

      - name: Determine sources
        id: sources
        run: |
          if [ "${{ inputs.sources }}" = "all" ]; then
            # Only the collections OpenSpecLib releases; reserved sources (relab,
            # asu_tes, bishop, ossl) ship only when named explicitly.
            echo "list=usgs,ecostress,ecosis" >> "$GITHUB_OUTPUT"
          else
            echo "list=${{ inputs.sources }}" >> "$GITHUB_OUTPUT"
          fi

      # Restore cached raw data BEFORE downloading: the downloaders skip
      # complete files, so a warm cache avoids re-fetching EcoSIS (~1,000
      # rate-limited API requests).
      - name: Restore cached raw source data
        uses: actions/cache@v4
        with:
          path: ./raw
          key: raw-sources-${{ hashFiles('src/openspeclib/loaders/*.py', 'src/openspeclib/loaders/*.json') }}
          restore-keys: |
            raw-sources-

      - name: Download source libraries
        run: |
          IFS=',' read -ra SOURCES <<< "${{ steps.sources.outputs.list }}"
          for source in "${SOURCES[@]}"; do
            source=$(echo "$source" | xargs)
            echo "::group::Downloading $source"
            # relab, asu_tes and bishop need manual placement; their
            # download step prints instructions and leaves the directory empty.
            openspeclib download --source "$source" --target "./raw/$source"
            echo "::endgroup::"
          done

      - name: Ingest source libraries
        run: |
          mkdir -p processed
          IFS=',' read -ra SOURCES <<< "${{ steps.sources.outputs.list }}"
          for source in "${SOURCES[@]}"; do
            source=$(echo "$source" | xargs)
            input_dir="./raw/$source"
            file_count=$(find "$input_dir" -type f \( -name "*.txt" -o -name "*.csv" -o -name "*.asc" -o -name "*.tab" -o -name "*.json" \) 2>/dev/null | head -1 | wc -l)
            # A requested source that yields nothing fails the build: a
            # release must never silently lose a collection.
            if [ "$file_count" -eq 0 ]; then
              echo "::error::No data files found for $source in $input_dir (manual download required)"
              exit 1
            fi
            before=$(find ./processed/ -name "*.jsonl" | wc -l)
            echo "::group::Ingesting $source"
            # ingest exits non-zero when a loader rejects files, failing the build.
            openspeclib ingest --source "$source" --input "$input_dir" --output ./processed/
            echo "::endgroup::"
            after=$(find ./processed/ -name "*.jsonl" | wc -l)
            if [ "$after" -le "$before" ]; then
              echo "::error::Ingesting $source produced no spectra"
              exit 1
            fi
          done

      - name: Check for processed data
        run: |
          jsonl_count=$(find ./processed/ -name "*.jsonl" 2>/dev/null | wc -l)
          if [ "$jsonl_count" -eq 0 ]; then
            echo "::error::No sources were successfully ingested."
            exit 1
          fi
          echo "Found $jsonl_count ingested source(s)"

      - name: Build release directory (Format v1)
        run: openspeclib combine --input ./processed/ --output ./library/ --release "${{ inputs.version }}"

      - name: Validate (conformance + OpenSpecLib quality profile)
        run: openspeclib validate ./library/ --profile openspeclib --report validation-report.json

      - name: Add validation report to the release assets
        run: |
          cp validation-report.json library/
          (cd library && sha256sum validation-report.json >> checksums.txt)
          (cd library && sha256sum --check --strict checksums.txt)

      - name: Generate release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          from openspeclib import storage

          version = os.environ["RELEASE_VERSION"]
          repo = os.environ.get("GITHUB_REPOSITORY", "null-jones/openspeclib")
          base = f"https://github.com/{repo}/releases/download/v{version}"
          blob = f"https://github.com/{repo}/blob/v{version}"
          index = storage.read_index_footer("library/openspeclib-index.parquet")
          entries = index["collections"]
          total = sum(e["num_spectra"] for e in entries)
          collections = "\n".join(
              f"- `{e['file']}`: {e['num_spectra']:,} spectra from {e['metadata']['collection']['title']}"
              f" ({e['metadata']['collection']['inclusion']})"
              for e in entries
          )

          notes = f"""## OpenSpecLib v{version}

          {total:,} spectra in [OpenSpecLib Format]({blob}/docs/spec/format-v1.md) {index['format_version']}.

          ### Assets

          Download all files into one directory.

          {collections}
          - `openspeclib-index.parquet`: every spectrum's metadata, without arrays, for fast search
          - `id-migration.csv`: maps spectrum ids from releases up to v0.0.7 to the ids used now
          - `validation-report.json`: the conformance and quality report for this release
          - `checksums.txt`: SHA-256 checksums of the files above

          Each collection file is self-describing: wavelengths, values, licences and citations are all inside it.
          Licences differ between collections and, for EcoSIS, between datasets. Each spectrum's `license`
          column and the file footer say what applies.

          ### Read one spectrum over HTTP

          ```sql
          INSTALL httpfs; LOAD httpfs;
          SELECT id, material_name, quantity, geometry, wavelength_unit, wavelengths, "values"
          FROM '{base}/usgs_splib07.parquet'
          WHERE id = 'usgs_splib07:splib07a_Kaolinite_CM9_BECKb_AREF';
          ```

          Query one id per `WHERE id = …`: DuckDB then reads a single row group. An `id IN (…)` list reads the whole file.

          Or with Python: `pip install "openspeclib[remote] @ git+https://github.com/{repo}.git@v{version}"`, then `openspeclib.open_index("{base}/openspeclib-index.parquet")`.

          Check any file against the standard with `openspeclib validate FILE --profile format`.

          See the [README]({blob}/README.md), the [format specification]({blob}/docs/spec/format-v1.md)
          and the [changelog]({blob}/CHANGELOG.md).
          """
          open("release_notes.md", "w").write(notes)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: OpenSpecLib v${{ inputs.version }}
          body_path: release_notes.md
          files: |
            library/*.parquet
            library/id-migration.csv
            library/validation-report.json
            library/checksums.txt
          draft: false
          prerelease: false
