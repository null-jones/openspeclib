[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openspeclib"
version = "0.2.0"
description = "The OpenSpecLib Format for spectral libraries: reference reader, writer, validator, converters and the OpenSpecLib collection build"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ellie Jones" }]
keywords = ["spectral-library", "spectroscopy", "remote-sensing", "USGS", "ECOSTRESS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "click>=8.0",
    "requests>=2.31",
    "tqdm>=4.65",
    "pyarrow>=15.0",
    "numpy>=1.24",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
build = []
# Remote (http/https) reads in openspeclib.reader.
remote = ["duckdb>=1.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "black>=24.0",
    "types-requests>=2.31",
    "types-jsonschema>=4.20",
    "types-tqdm>=4.65",
    "duckdb>=1.1",
    # Checks in tests/test_convert.py that exported ENVI libraries open in Spectral Python.
    "spectral>=0.23",
]

[project.scripts]
openspeclib = "openspeclib.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openspeclib"]

# Ship the normative Format v1 schema files inside the package so the
# conformance checker finds them in wheel installs; editable installs and
# source checkouts read schemas/format-v1 directly
# (see openspeclib.conformance.spec_dir).
[tool.hatch.build.targets.wheel.force-include]
"schemas/format-v1" = "openspeclib/_schemas/format-v1"

# Keep the sdist to the sources (by default hatch includes every file not
# ignored by git, e.g. local build output). The wheel is built from the sdist,
# so `schemas` must be here for the force-include above. Patterns are
# gitignore-style: the leading "/" anchors them at the project root (an
# unanchored "src" would also match viewer/src).
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/tests",
    "/scripts",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/CHANGELOG.md",
    "/CITATION.cff",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # isort
    "W",       # pycodestyle warnings
    "D",       # pydocstyle (docstring conventions)
    "ANN",     # flake8-annotations (type hints)
]
ignore = [
    "ANN401",  # dynamically typed expressions (typing.Any) are disallowed
    "D100",    # missing docstring in public module (module docstrings already present)
    "D104",    # missing docstring in public package
    "D107",    # missing docstring in __init__
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]
"scripts/**/*.py" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# pyarrow ships no PEP 561 stubs as of v23. Treat its API as untyped at
# the storage-layer boundary; openspeclib.storage narrows back to Pydantic
# models before exposing anything to the rest of the codebase.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The storage layer and the OSSL CSV loader are the only modules that
# call pyarrow directly. When CI installs a pyarrow build whose stubs
# are partial (newer releases mark the package PEP-561 but ship
# incomplete annotations) the ``Call to untyped function`` and
# ``Module ... does not explicitly export attribute`` errors fire on
# routine pyarrow calls. We accept untyped calls inside this narrow
# boundary; types are re-asserted as the data leaves these modules.
# The conformance checker and the validator also compute over pyarrow
# arrays directly and need the same allowance.
module = [
    "openspeclib.storage",
    "openspeclib.reader",
    "openspeclib.loaders.ossl",
    "openspeclib.conformance",
    "openspeclib.validate",
]
disallow_untyped_calls = false
warn_unused_ignores = false
